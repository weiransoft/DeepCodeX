<style>
/* ===== Token 定义（亮色默认 + 暗色覆盖）=====
   置于 <style> 顶部，组件样式之前；默认紫色主题。 */
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;
  --success: #1DC981;
  --warning: #EFAA17;
  --danger: #E8463A;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
/* 暗色主题覆盖：默认紫色 brand 暗色阶 */
:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
}
/* 独立打开时跟随系统暗色（可选降级） */
@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme="light"]) {
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #6054F1;
    --brand-soft: #1A1759;
    --brand-soft-strong: #3C2ECA;
    --brand-text: #CFD8FF;
    --chart-series-1: #4B3FE3;
  }
}

/* ===== 组件样式 ===== */
.fbc-widget {
  color: var(--text);
  background: transparent;
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  letter-spacing: 0;
}
.fbc-head { margin: 0 0 var(--spacer-16); }
.fbc-head__title { font: var(--weight-medium) var(--text-title) var(--font-sans); color: var(--text); margin: 0; }
.fbc-head__sub { font: var(--weight-regular) var(--text-caption) var(--font-sans); color: var(--text-muted); margin: var(--spacer-4) 0 0; }
/* 图表容器：显式高度 + position: relative 满足 Chart.js 响应式契约 */
.fbc-chart-wrap { position: relative; height: clamp(240px, 32vw, 360px); max-height: 600px; }
/* 可见降级表格：JS 执行前可见，Chart.js 创建成功后隐藏 */
.fbc-fallback { border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
.fbc-fallback table { width: 100%; border-collapse: collapse; }
.fbc-fallback th, .fbc-fallback td { padding: var(--spacer-12); text-align: left; font: var(--weight-regular) var(--text-body) var(--font-sans); color: var(--text); border-bottom: 1px solid var(--border); }
.fbc-fallback th { background: var(--surface-muted); font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); }
.fbc-fallback td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.fbc-fallback tr:last-child td { border-bottom: none; }
/* HTML 提示框：Shadcn 风格，widget 根内绝对定位 */
.fbc-tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--spacer-12); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); font: var(--weight-regular) var(--text-caption) var(--font-sans); color: var(--text); z-index: 10; min-width: 160px; transition: opacity 100ms ease; }
.fbc-tooltip[hidden] { opacity: 0; }
.fbc-tooltip__title { font: var(--weight-medium) var(--text-body) var(--font-sans); color: var(--text); margin: 0 0 var(--spacer-4); }
.fbc-tooltip__row { display: flex; justify-content: space-between; gap: var(--spacer-12); margin: var(--spacer-4) 0; }
.fbc-tooltip__label { color: var(--text-muted); }
.fbc-tooltip__value { font: var(--weight-medium) var(--text-code) var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.fbc-tooltip__dot { display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-full); margin-right: var(--spacer-8); vertical-align: middle; }
/* 基线对比条带：紧凑行布局，焦点行用 brand 边框 */
.fbc-strip { margin-top: var(--spacer-16); border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
.fbc-strip__row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; align-items: center; padding: var(--spacer-12) var(--spacer-16); gap: var(--spacer-8); border-bottom: 1px solid var(--border); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.fbc-strip__row:last-child { border-bottom: none; }
.fbc-strip__row--focus { border: 1.5px solid var(--brand); border-radius: var(--radius); margin: var(--spacer-4); }
.fbc-strip__head { background: var(--surface-muted); color: var(--text-muted); font: var(--weight-medium) var(--text-caption) var(--font-sans); }
.fbc-strip__stage { color: var(--text); font-weight: var(--weight-medium); }
.fbc-strip__num { font: var(--weight-medium) var(--text-code) var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.fbc-strip__delta { color: var(--text-muted); }
</style>

<div data-dynamic-ui-widget data-template="funnel-bar-chart" class="fbc-widget">
  <!-- 紧凑标题：场景定位，不含分析结论 -->
  <div class="fbc-head">
    <h3 class="fbc-head__title">注册转化漏斗</h3>
    <p class="fbc-head__sub">5 阶段流失与行业基准对比 · 单位：用户数</p>
  </div>

  <!-- 可见降级：HTML 表格，JS 执行前可见 -->
  <div class="fbc-fallback" data-fallback>
    <table>
      <thead><tr><th>阶段</th><th>实际用户</th><th>步转化</th></tr></thead>
      <tbody>
        <tr><td>访问首页</td><td>12,580</td><td>—</td></tr>
        <tr><td>查看产品</td><td>8,240</td><td>65.5%</td></tr>
        <tr><td>加入购物车</td><td>4,150</td><td>50.4%</td></tr>
        <tr><td>进入结算</td><td>1,860</td><td>44.8%</td></tr>
        <tr><td>完成支付</td><td>920</td><td>49.5%</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Chart.js canvas 容器：显式高度 + position: relative -->
  <div class="fbc-chart-wrap" data-chart-wrap hidden>
    <canvas></canvas>
    <!-- HTML 提示框容器，widget 根内 -->
    <div class="fbc-tooltip" data-tooltip hidden></div>
  </div>

  <!-- 基线对比条带：流失最大相邻阶段用 brand 边框标记焦点 -->
  <div class="fbc-strip" data-strip hidden>
    <div class="fbc-strip__row fbc-strip__head">
      <span>阶段</span><span>实际</span><span>步转化</span><span>行业基准</span><span>Δ 基准</span>
    </div>
    <!-- 行由 JS 动态填充 -->
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
/* 根选择器初始化：限定在根元素内，绑定前设 data-mounted 防止重复挂载 */
(function () {
  var root = document.querySelector('[data-dynamic-ui-widget][data-template="funnel-bar-chart"]:not([data-mounted])');
  if (!root) { return; }
  root.setAttribute('data-mounted', 'true');

  /* 数据：有序阶段 + 基线对比 */
  var stages = [
    { name: '访问首页', value: 12580 },
    { name: '查看产品', value: 8240 },
    { name: '加入购物车', value: 4150 },
    { name: '进入结算', value: 1860 },
    { name: '完成支付', value: 920 }
  ];
  var baseline = [
    { name: '访问首页', value: 12580 },
    { name: '查看产品', value: 9800 },
    { name: '加入购物车', value: 5290 },
    { name: '进入结算', value: 2510 },
    { name: '完成支付', value: 1380 }
  ];

  /* 计算：步转化率（相对上一阶段）+ 最大流失相邻阶段（焦点） */
  var stepConv = stages.map(function (s, i) {
    return i === 0 ? null : (s.value / stages[i - 1].value * 100);
  });
  var maxDropIdx = 1;
  var maxDropRate = 0;
  for (var i = 1; i < stages.length; i++) {
    var dropRate = 1 - stages[i].value / stages[i - 1].value;
    if (dropRate > maxDropRate) { maxDropRate = dropRate; maxDropIdx = i; }
  }

  /* 读取 token：所有颜色来自 widget 根的 CSS 变量，禁硬编码 */
  var cs = getComputedStyle(root);
  var series1 = cs.getPropertyValue('--chart-series-1').trim();
  var series2 = cs.getPropertyValue('--chart-series-2').trim();
  var textOn = cs.getPropertyValue('--brand-on').trim();
  var textMuted = cs.getPropertyValue('--text-muted').trim();
  var border = cs.getPropertyValue('--border').trim();

  /* 渲染基线对比条带：焦点行用 brand 边框 */
  var stripEl = root.querySelector('[data-strip]');
  stages.forEach(function (s, i) {
    var row = document.createElement('div');
    row.className = 'fbc-strip__row';
    if (i === maxDropIdx) { row.classList.add('fbc-strip__row--focus'); }
    var convTxt = stepConv[i] === null ? '—' : stepConv[i].toFixed(1) + '%';
    var deltaPct = ((s.value - baseline[i].value) / baseline[i].value * 100).toFixed(1);
    var deltaTxt = (deltaPct >= 0 ? '+' : '') + deltaPct + '%';
    row.innerHTML =
      '<span class="fbc-strip__stage">' + s.name + '</span>' +
      '<span class="fbc-strip__num">' + s.value.toLocaleString() + '</span>' +
      '<span class="fbc-strip__num">' + convTxt + '</span>' +
      '<span class="fbc-strip__num" style="color:var(--text-muted)">' + baseline[i].value.toLocaleString() + '</span>' +
      '<span class="fbc-strip__delta">' + deltaTxt + '</span>';
    stripEl.appendChild(row);
  });
  stripEl.hidden = false;

  /* Chart.js 不可用时保留降级表格，跳过图表初始化 */
  if (typeof Chart === 'undefined') { return; }

  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) { return; }

  /* 漏斗居中：浮动区间 [-v/2, +v/2]，X 轴刻度显示绝对值 */
  var currentData = stages.map(function (s) { return [-s.value / 2, s.value / 2]; });
  var baselineData = baseline.map(function (b) { return [-b.value / 2, b.value / 2]; });

  /* 值标签插件：在实际柱上绘制数值与步转化率 */
  var valueLabelPlugin = {
    id: 'fbcValueLabels',
    afterDatasetsDraw: function (chart) {
      var c = chart.ctx;
      var meta = chart.getDatasetMeta(1); /* 实际 dataset */
      stages.forEach(function (s, i) {
        var bar = meta.data[i];
        if (!bar) { return; }
        c.save();
        c.fillStyle = textOn;
        c.font = '500 13px "JetBrains Mono", ui-monospace, monospace';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(s.value.toLocaleString(), bar.x, bar.y - 7);
        if (stepConv[i] !== null) {
          c.font = '400 11px "SF Pro Text", system-ui, sans-serif';
          c.fillText('步转化 ' + stepConv[i].toFixed(1) + '%', bar.x, bar.y + 8);
        }
        c.restore();
      });
    }
  };

  /* 外部 HTML 提示框处理器：禁用 canvas 内建 tooltip */
  var tooltipEl = root.querySelector('[data-tooltip]');
  function externalTooltip(context) {
    var tt = context.tooltip;
    if (tt.opacity === 0) { tooltipEl.hidden = true; return; }
    var idx = tt.dataPoints && tt.dataPoints[0] ? tt.dataPoints[0].dataIndex : 0;
    var s = stages[idx];
    var b = baseline[idx];
    var overallConv = (s.value / stages[0].value * 100).toFixed(1);
    var convTxt = stepConv[idx] === null ? '—' : stepConv[idx].toFixed(1) + '%';
    tooltipEl.innerHTML =
      '<div class="fbc-tooltip__title">' + s.name + '</div>' +
      '<div class="fbc-tooltip__row"><span class="fbc-tooltip__label"><span class="fbc-tooltip__dot" style="background:' + series1 + '"></span>实际</span><span class="fbc-tooltip__value">' + s.value.toLocaleString() + '</span></div>' +
      '<div class="fbc-tooltip__row"><span class="fbc-tooltip__label"><span class="fbc-tooltip__dot" style="background:' + series2 + '"></span>基准</span><span class="fbc-tooltip__value">' + b.value.toLocaleString() + '</span></div>' +
      '<div class="fbc-tooltip__row"><span class="fbc-tooltip__label">步转化</span><span class="fbc-tooltip__value">' + convTxt + '</span></div>' +
      '<div class="fbc-tooltip__row"><span class="fbc-tooltip__label">总体转化</span><span class="fbc-tooltip__value">' + overallConv + '%</span></div>';
    /* 提示框定位约束在图表边界内 */
    var wrap = root.querySelector('[data-chart-wrap]');
    var wrapWidth = wrap.getBoundingClientRect().width;
    var x = tt.caretX + 12;
    if (x + 180 > wrapWidth) { x = tt.caretX - 192; }
    tooltipEl.style.left = x + 'px';
    tooltipEl.style.top = tt.caretY + 'px';
    tooltipEl.hidden = false;
  }

  /* Chart 实例：水平浮动柱状图，实际 + 基线叠加形成漏斗 */
  var chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: stages.map(function (s) { return s.name; }),
      datasets: [
        {
          label: '行业基准',
          data: baselineData,
          backgroundColor: 'transparent',
          borderColor: series2,
          borderWidth: 1.5,
          borderRadius: 6,
          barPercentage: 0.92,
          categoryPercentage: 0.85,
          order: 2
        },
        {
          label: '实际',
          data: currentData,
          backgroundColor: series1,
          borderColor: series1,
          borderWidth: 0,
          borderRadius: 6,
          barPercentage: 0.72,
          categoryPercentage: 0.85,
          order: 1
        }
      ]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 180 },
      interaction: { mode: 'nearest', intersect: true },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip }
      },
      scales: {
        x: {
          ticks: { callback: function (v) { return Math.abs(v).toLocaleString(); }, color: textMuted, font: { size: 12 } },
          grid: { color: border, drawBorder: false },
          border: { display: false }
        },
        y: {
          ticks: { color: textMuted, font: { size: 13 } },
          grid: { display: false },
          border: { display: false }
        }
      }
    },
    plugins: [valueLabelPlugin]
  });

  /* 图表创建成功后隐藏降级表格，显示 canvas */
  if (chart) {
    root.querySelector('[data-fallback]').style.display = 'none';
    root.querySelector('[data-chart-wrap]').hidden = false;
  }
})();
</script>
