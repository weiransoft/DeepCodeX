<style>
/* ===== Token 定义（亮色默认 + 暗色覆盖）=====
   置于 <style> 顶部，组件样式之前；默认紫色主题。 */
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;
  --success: #1DC981;
  --warning: #EFAA17;
  --danger: #E8463A;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
/* 暗色主题覆盖：默认紫色 brand 暗色阶 */
:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme="light"]) {
    --surface: #171717; --surface-muted: #262626;
    --text: #E5E5E5; --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #6054F1; --brand-soft: #1A1759;
    --brand-soft-strong: #3C2ECA; --brand-text: #CFD8FF;
    --chart-series-1: #4B3FE3;
  }
}

/* ===== 组件样式 ===== */
.gn-widget {
  color: var(--text);
  background: transparent;
  font: var(--weight-regular) var(--text-body) var(--font-sans);
}
.gn-head { margin: 0 0 var(--spacer-16); }
.gn-head__title {
  font: var(--weight-medium) var(--text-title) var(--font-sans);
  color: var(--text); margin: 0;
}
.gn-head__sub {
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
  color: var(--text-muted); margin: var(--spacer-4) 0 0;
}
/* SVG 画布：响应式 + 显式高度 */
.gn-svg {
  width: 100%;
  height: auto;
  display: block;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
}
/* SVG 文本类（与 tokens/visual-tokens.md 图示色板一致） */
.gn-svg .t { fill: var(--text); font: var(--weight-regular) var(--text-body) var(--font-sans); }
.gn-svg .th { fill: var(--text); font: var(--weight-medium) var(--text-body) var(--font-sans); }
.gn-svg .ts { fill: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-sans); }
.gn-svg .tm { fill: var(--text-muted); font: var(--weight-regular) var(--text-caption) var(--font-mono); font-variant-numeric: tabular-nums; }
/* 网格线 */
.gn-svg .grid { stroke: var(--border); stroke-width: 1; fill: none; }
/* 任务条：默认 chart-series-1；关键路径用 brand */
.gn-svg .bar { rx: 4; ry: 4; transition: opacity 100ms ease; }
.gn-svg .bar:hover { opacity: 0.85; }
.gn-svg .bar-critical { fill: var(--brand); }
.gn-svg .bar-normal-1 { fill: var(--chart-series-1); }
.gn-svg .bar-normal-2 { fill: var(--chart-series-2); }
.gn-svg .bar-normal-3 { fill: var(--chart-series-3); }
.gn-svg .bar-normal-4 { fill: var(--chart-series-4); }
/* 里程碑菱形 */
.gn-svg .milestone { fill: var(--brand); stroke: var(--brand-soft); stroke-width: 1.5; }
.gn-svg .milestone-stem { stroke: var(--text-muted); stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
/* 图例 */
.gn-legend {
  display: flex; flex-wrap: wrap; gap: var(--spacer-12);
  margin-top: var(--spacer-12);
  font: var(--weight-regular) var(--text-caption) var(--font-sans);
  color: var(--text-muted);
}
.gn-legend__item { display: flex; align-items: center; gap: var(--spacer-8); }
.gn-legend__swatch {
  width: 12px; height: 12px; border-radius: var(--radius);
  display: inline-block;
}
.gn-legend__swatch--diamond {
  border-radius: 0; transform: rotate(45deg);
  width: 10px; height: 10px;
}
</style>

<script>
/* 根选择器初始化：限定在根元素内，绑定前设 data-mounted 防止重复挂载
   gantt-chart 不依赖 Chart.js，SVG 直接渲染；本脚本仅处理悬停可达性增强 */
(function () {
  var root = document.querySelector('[data-dynamic-ui-widget][data-template="gantt-chart"]:not([data-mounted])');
  if (!root) { return; }
  root.setAttribute('data-mounted', 'true');

  /* 任务条悬停：聚焦时加强调，移开时还原；
     使用 addEventListener 而非内联事件处理器（遵循安全规则） */
  var bars = root.querySelectorAll('.gn-svg .bar');
  bars.forEach(function (bar) {
    /* 鼠标悬停：添加 brand 描边强调 */
    bar.addEventListener('mouseenter', function () {
      bar.setAttribute('stroke', 'var(--brand)');
      bar.setAttribute('stroke-width', '2');
    });
    bar.addEventListener('mouseleave', function () {
      bar.removeAttribute('stroke');
      bar.removeAttribute('stroke-width');
    });
    /* 键盘可达性：Tab 可聚焦，Enter/Space 触发 title 提示 */
    bar.setAttribute('tabindex', '0');
    bar.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        var title = bar.querySelector('title');
        if (title && typeof title.textContent === 'string') {
          /* 简短提示：仅触发原生 title 行为，不弹额外 DOM */
          bar.focus();
        }
      }
    });
  });
})();
</script>
