<style>
/* ===== Token 定义（亮色默认 + 暗色覆盖）=====
   置于 <style> 顶部，组件样式之前；默认紫色主题。 */
:root {
  color-scheme: light;
  --surface: #F7F7F8;
  --surface-muted: #EFEFF2;
  --text: #171717;
  --text-muted: #52525B;
  --border: rgba(23, 23, 23, 0.12);
  --brand: #4B3FE3;
  --brand-soft: #F2F7FF;
  --brand-soft-strong: #E5EAFF;
  --brand-text: #1A1759;
  --brand-on: #FFFFFF;
  --chart-series-1: #3C2ECA;
  --chart-series-2: #A9AEFF;
  --chart-series-3: #6F6FFF;
  --chart-series-4: #22A5F7;
  --chart-other: #D3D4DA;
  --success: #1DC981;
  --warning: #EFAA17;
  --danger: #E8463A;
  --radius: 8px;
  --radius-card: 12px;
  --radius-full: 999px;
  --spacer-4: 4px;
  --spacer-8: 8px;
  --spacer-12: 12px;
  --spacer-16: 16px;
  --spacer-20: 20px;
  --spacer-24: 24px;
  --font-sans: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-metric: "Inter", "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-strong: 600;
  --text-caption: 12px/18px;
  --text-body: 14px/20px;
  --text-title: 16px/24px;
  --text-code: 13px/20px;
}
/* 暗色主题覆盖：默认紫色 brand 暗色阶 */
:root[data-widget-theme="dark"] {
  color-scheme: dark;
  --surface: #171717;
  --surface-muted: #262626;
  --text: #E5E5E5;
  --text-muted: #A1A1AA;
  --border: rgba(229, 229, 229, 0.12);
  --brand: #6054F1;
  --brand-soft: #1A1759;
  --brand-soft-strong: #3C2ECA;
  --brand-text: #CFD8FF;
  --chart-series-1: #4B3FE3;
}
/* 独立打开时跟随系统暗色（可选降级） */
@media (prefers-color-scheme: dark) {
  :root:not([data-widget-theme="light"]) {
    --surface: #171717;
    --surface-muted: #262626;
    --text: #E5E5E5;
    --text-muted: #A1A1AA;
    --border: rgba(229, 229, 229, 0.12);
    --brand: #6054F1;
    --brand-soft: #1A1759;
    --brand-soft-strong: #3C2ECA;
    --brand-text: #CFD8FF;
    --chart-series-1: #4B3FE3;
  }
}

/* ===== 组件样式 ===== */
.sk-widget {
  color: var(--text);
  background: transparent;
  font: var(--weight-regular) var(--text-body) var(--font-sans);
  letter-spacing: 0;
}
.sk-head { margin: 0 0 var(--spacer-16); }
.sk-head__title { font: var(--weight-medium) var(--text-title) var(--font-sans); color: var(--text); margin: 0; }
.sk-head__sub { font: var(--weight-regular) var(--text-caption) var(--font-sans); color: var(--text-muted); margin: var(--spacer-4) 0 0; }
/* 图表容器：显式高度 + position: relative 满足 Chart.js 响应式契约 */
.sk-chart-wrap { position: relative; height: clamp(280px, 36vw, 460px); max-height: 600px; }
/* 可见降级：紧凑表格，JS 执行前可见 */
.sk-fallback { border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
.sk-fallback table { width: 100%; border-collapse: collapse; }
.sk-fallback th, .sk-fallback td { padding: var(--spacer-12); text-align: left; font: var(--weight-regular) var(--text-body) var(--font-sans); color: var(--text); border-bottom: 1px solid var(--border); }
.sk-fallback th { background: var(--surface-muted); font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); }
.sk-fallback td:last-child { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.sk-fallback tr:last-child td { border-bottom: none; }
/* HTML 提示框：Shadcn 风格，widget 根内绝对定位 */
.sk-tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--spacer-12); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); font: var(--weight-regular) var(--text-caption) var(--font-sans); color: var(--text); z-index: 10; min-width: 180px; transition: opacity 100ms ease; }
.sk-tooltip[hidden] { opacity: 0; }
.sk-tooltip__title { font: var(--weight-medium) var(--text-body) var(--font-sans); color: var(--text); margin: 0 0 var(--spacer-4); }
.sk-tooltip__row { display: flex; justify-content: space-between; gap: var(--spacer-12); margin: var(--spacer-4) 0; }
.sk-tooltip__label { color: var(--text-muted); }
.sk-tooltip__value { font: var(--weight-medium) var(--text-code) var(--font-mono); color: var(--text); font-variant-numeric: tabular-nums; }
.sk-tooltip__arrow { color: var(--text-muted); margin: 0 var(--spacer-4); }
/* 阶段标签条：从左到右分层语义 */
.sk-stages { display: flex; justify-content: space-between; margin: 0 0 var(--spacer-8); padding: 0 var(--spacer-4); }
.sk-stages__item { font: var(--weight-medium) var(--text-caption) var(--font-sans); color: var(--text-muted); }
</style>

<div data-dynamic-ui-widget data-template="sankey-chart" class="sk-widget">
  <!-- 紧凑标题：场景定位，不含分析结论 -->
  <div class="sk-head">
    <h3 class="sk-head__title">用户流量路径分布</h3>
    <p class="sk-head__sub">来源 → 互动 → 结果 三阶段加权流动 · 单位：用户数</p>
  </div>

  <!-- 阶段标签条：分层语义 -->
  <div class="sk-stages">
    <span class="sk-stages__item">来源</span>
    <span class="sk-stages__item">互动</span>
    <span class="sk-stages__item">结果</span>
  </div>

  <!-- 可见降级：紧凑表格，JS 执行前可见 -->
  <div class="sk-fallback" data-fallback>
    <table>
      <thead><tr><th>来源</th><th>目标</th><th>流量</th></tr></thead>
      <tbody>
        <tr><td>自然搜索</td><td>浏览详情</td><td>4,200</td></tr>
        <tr><td>自然搜索</td><td>加入购物车</td><td>800</td></tr>
        <tr><td>付费广告</td><td>浏览详情</td><td>3,100</td></tr>
        <tr><td>付费广告</td><td>加入购物车</td><td>600</td></tr>
        <tr><td>直接访问</td><td>浏览详情</td><td>1,800</td></tr>
        <tr><td>直接访问</td><td>加入购物车</td><td>700</td></tr>
        <tr><td>浏览详情</td><td>完成购买</td><td>1,200</td></tr>
        <tr><td>浏览详情</td><td>流失</td><td>7,900</td></tr>
        <tr><td>加入购物车</td><td>完成购买</td><td>1,500</td></tr>
        <tr><td>加入购物车</td><td>流失</td><td>600</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Chart.js canvas 容器：显式高度 + position: relative -->
  <div class="sk-chart-wrap" data-chart-wrap hidden>
    <canvas></canvas>
    <!-- HTML 提示框容器，widget 根内 -->
    <div class="sk-tooltip" data-tooltip hidden></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-sankey@2"></script>
<script>
/* 根选择器初始化：限定在根元素内，绑定前设 data-mounted 防止重复挂载 */
(function () {
  var root = document.querySelector('[data-dynamic-ui-widget][data-template="sankey-chart"]:not([data-mounted])');
  if (!root) { return; }
  root.setAttribute('data-mounted', 'true');

  /* 数据：有向无环图，flows 为加权边，节点由 flows 派生 */
  var flows = [
    { from: '自然搜索', to: '浏览详情', flow: 4200 },
    { from: '自然搜索', to: '加入购物车', flow: 800 },
    { from: '付费广告', to: '浏览详情', flow: 3100 },
    { from: '付费广告', to: '加入购物车', flow: 600 },
    { from: '直接访问', to: '浏览详情', flow: 1800 },
    { from: '直接访问', to: '加入购物车', flow: 700 },
    { from: '浏览详情', to: '完成购买', flow: 1200 },
    { from: '浏览详情', to: '流失', flow: 7900 },
    { from: '加入购物车', to: '完成购买', flow: 1500 },
    { from: '加入购物车', to: '流失', flow: 600 }
  ];

  /* 读取 token：所有颜色来自 widget 根的 CSS 变量，禁硬编码 */
  var cs = getComputedStyle(root);
  var series1 = cs.getPropertyValue('--chart-series-1').trim();
  var series2 = cs.getPropertyValue('--chart-series-2').trim();
  var series3 = cs.getPropertyValue('--chart-series-3').trim();
  var series4 = cs.getPropertyValue('--chart-series-4').trim();
  var other = cs.getPropertyValue('--chart-other').trim();
  var success = cs.getPropertyValue('--success').trim();
  var textMuted = cs.getPropertyValue('--text-muted').trim();
  var border = cs.getPropertyValue('--border').trim();

  /* 节点颜色映射：同辈来源按序 chart-series；结果节点编码状态变量（转化/流失），
     此为 sankey 模板本地例外，不得复制到其他模板 */
  var nodeColors = {
    '自然搜索': series1,
    '付费广告': series2,
    '直接访问': series3,
    '浏览详情': series1,
    '加入购物车': series4,
    '完成购买': success, /* 正面结果状态 */
    '流失': other        /* 去强调余项 */
  };

  /* 计算总流量，用于提示框百分比 */
  var totalFlow = flows.reduce(function (sum, f) { return sum + f.flow; }, 0);

  /* chartjs-chart-sankey 插件不可用时保留降级表格，跳过初始化 */
  if (typeof Chart === 'undefined' || !Chart.controllers || !Chart.controllers.sankey) { return; }

  var canvas = root.querySelector('canvas');
  var ctx = canvas.getContext('2d');
  if (!ctx) { return; }

  /* 外部 HTML 提示框处理器：禁用 canvas 内建 tooltip */
  var tooltipEl = root.querySelector('[data-tooltip]');
  function externalTooltip(context) {
    var tt = context.tooltip;
    if (!tt || tt.opacity === 0 || !tt.dataPoints || !tt.dataPoints.length) {
      tooltipEl.hidden = true;
      return;
    }
    var dp = tt.dataPoints[0];
    var raw = dp.raw;
    /* 同时处理节点悬停与链路悬停：raw 含 from/to 为链路；仅含节点名为节点 */
    if (raw && raw.from && raw.to) {
      var pct = (raw.flow / totalFlow * 100).toFixed(1);
      tooltipEl.innerHTML =
        '<div class="sk-tooltip__title">' + raw.from + '<span class="sk-tooltip__arrow">→</span>' + raw.to + '</div>' +
        '<div class="sk-tooltip__row"><span class="sk-tooltip__label">流量</span><span class="sk-tooltip__value">' + raw.flow.toLocaleString() + '</span></div>' +
        '<div class="sk-tooltip__row"><span class="sk-tooltip__label">占总流量</span><span class="sk-tooltip__value">' + pct + '%</span></div>';
    } else {
      var nodeName = raw && (raw.from || raw.name) ? (raw.name || raw.from) : '节点';
      tooltipEl.innerHTML = '<div class="sk-tooltip__title">' + nodeName + '</div>';
    }
    /* 提示框定位约束在图表边界内 */
    var wrap = root.querySelector('[data-chart-wrap]');
    var wrapWidth = wrap.getBoundingClientRect().width;
    var wrapHeight = wrap.getBoundingClientRect().height;
    var x = tt.caretX + 12;
    var y = tt.caretY;
    if (x + 200 > wrapWidth) { x = tt.caretX - 212; }
    if (y + 80 > wrapHeight) { y = wrapHeight - 90; }
    tooltipEl.style.left = x + 'px';
    tooltipEl.style.top = y + 'px';
    tooltipEl.hidden = false;
  }

  /* Chart 实例：sankey 类型，节点按颜色映射分层 */
  var chart = new Chart(ctx, {
    type: 'sankey',
    data: {
      datasets: [{
        label: '流量路径',
        data: flows,
        /* colorFrom/colorTo：每条边的源/目标节点颜色 */
        colorFrom: function (c) { return nodeColors[c.raw.from] || other; },
        colorTo: function (c) { return nodeColors[c.raw.to] || other; },
        colorMode: 'gradient',
        borderWidth: 0,
        /* 节点宽度与间距：字面几何值，非 token */
        nodeWidth: 14,
        nodePadding: 14,
        /* 节点标签样式 */
        nodeLabelColor: function () { return textMuted; },
        nodeLabelFont: { size: 12, family: '"SF Pro Text", system-ui, sans-serif' }
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 200 },
      interaction: { mode: 'nearest', intersect: true },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: externalTooltip }
      },
      scales: {
        x: { display: false },
        y: { display: false }
      }
    }
  });

  /* 图表创建成功后隐藏降级表格，显示 canvas */
  if (chart) {
    root.querySelector('[data-fallback]').style.display = 'none';
    root.querySelector('[data-chart-wrap]').hidden = false;
  }
})();
</script>
