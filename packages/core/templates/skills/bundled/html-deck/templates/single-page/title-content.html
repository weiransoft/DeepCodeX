<!DOCTYPE html>
<!--
  html-deck 模板：title-content
  版式：封面 + 内容 + 结语，适用于简短演讲或作为完整 deck 的起点。

  使用方式：
  1. 复制本文件到 <deck>/<name>.html
  2. 将 ../../assets/ 路径改为 ./_shared/（运行 new-deck.sh 后自动处理）
  3. 替换演示文本为实际内容
  4. 浏览器打开即可放映

  键盘操作：
    → / Space / Enter  下一页
    ←                  上一页
    F                  全屏
    T                  切换主题（light/dark）
    O                  总览模式
    N                  演讲者备注
-->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>标题+内容模板 — html-deck</title>
<!-- 模板路径：从 templates/single-page/ 引用 ../../assets/；最终 deck 中改为 ./_shared/ -->
<link rel="stylesheet" href="../../assets/base.css">
<link id="theme-link" rel="stylesheet" href="../../assets/themes/light.css">
<style>
  /* 封面专属样式：背景纹理叠加 */
  .cover-slide {
    background:
      radial-gradient(60% 50% at 30% 40%, rgba(59, 108, 255, .12), transparent 70%),
      radial-gradient(50% 40% at 75% 60%, rgba(122, 92, 255, .1), transparent 70%),
      var(--bg);
  }
  /* 内容页要点列表 */
  .points { list-style: none; padding: 0; margin: 24px 0 0; max-width: 64ch; }
  .points li {
    padding: 14px 0 14px 32px;
    border-bottom: 1px solid var(--border);
    position: relative;
    font-size: 18px;
    color: var(--text-2);
  }
  .points li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 22px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
  .points li:last-child { border-bottom: none; }
  .points li strong { color: var(--text-1); font-weight: 600; }
</style>
</head>
<body class="single" data-themes="light,dark" data-theme-base="../../assets/themes/">
<div class="deck">

  <!-- 1. 封面 -->
  <section class="slide cover-slide is-active" data-title="封面" data-anim="fade-up">
    <div class="deck-header">
      <span class="eyebrow">Keynote · 2026</span>
      <span class="eyebrow">html-deck</span>
    </div>
    <p class="kicker">演示文稿</p>
    <h1 class="h1">你的演示标题</h1>
    <p class="lede">副标题或一句话简介，说明本次分享的核心价值。</p>
    <div class="deck-footer">
      <span class="dim2">作者 · 2026</span>
      <span class="slide-number" data-current="1" data-total="3"></span>
    </div>
    <div class="notes">封面页口播稿：大家好，今天分享的主题是…开场可以简述本次分享的背景与目标。</div>
  </section>

  <!-- 2. 内容页 -->
  <section class="slide" data-title="内容" data-anim="fade-up">
    <p class="kicker">核心内容</p>
    <h2 class="h2">三个要点</h2>
    <ul class="points anim-stagger-list">
      <li><strong>第一点</strong>：简述核心观点与支撑论据</li>
      <li><strong>第二点</strong>：展开具体案例或数据</li>
      <li><strong>第三点</strong>：总结与下一步行动</li>
    </ul>
    <div class="deck-footer">
      <span class="dim2">作者 · 2026</span>
      <span class="slide-number" data-current="2" data-total="3"></span>
    </div>
    <div class="notes">内容页口播稿：逐点展开，每个要点约 1-2 分钟。配合手势与停顿。</div>
  </section>

  <!-- 3. 结语 -->
  <section class="slide center" data-title="结语" data-anim="zoom-pop">
    <h1 class="h1" style="font-size: 120px; line-height: 1">
      <span class="gradient-text">谢谢</span>
    </h1>
    <p class="lede mt-m">欢迎提问与交流</p>
    <div class="deck-footer">
      <span class="dim2">作者 · 2026</span>
      <span class="slide-number" data-current="3" data-total="3"></span>
    </div>
    <div class="notes">结语页：感谢观看，预留 Q&A 时间。</div>
  </section>

</div>
<script src="../../assets/runtime.js"></script>
</body>
</html>
