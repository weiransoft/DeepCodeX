# =============================================================================
# bio-vlab backend —— Alembic 配置（T-004 / D4 修复）
#
# 背景：旧实现启动期裸 Base.metadata.create_all(bind=engine)（等价
# checkfirst=False），对已存在的表仍发 CREATE，触发 pymysql 1050
# "Table 'component_dispatches' already exists" 告警栈；backend 单副本 +
# celery-worker 多副本并发启动时必现。现结构演进交由本文件驱动的迁移管理：
#   compose 服务 backend 设 MIGRATIONS_ENABLED=true
#     → app.database.run_migrations() → alembic upgrade head
#     （内部取 MySQL 命名锁 GET_LOCK('bio_vlab_alembic_migrate') 串行化）
#   部署时本文件与 ./alembic 以只读卷挂载到 /opt/bio-vlab/（见 compose）。
#
# 注意：sqlalchemy.url 故意留空 —— 运行时由 run_migrations() 用 engine.url
# 覆盖（alembic.ini 内绝不写入含口令的 DSN，避免口令进 git）。
# 也可显式设 env ALEMBIC_INI 指向其他 ini 路径。
# =============================================================================

[alembic]
# 迁移脚本目录。run_migrations() 会用 script_location = <ini 所在目录>/alembic
# 覆盖本项，因此仓库内与容器挂载点（/opt/bio-vlab/alembic）均可直接工作。
script_location = alembic

# 迁移文件名模板：rev 前缀 + 时间 + slug，便于按时间排序 review
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# 用 localtime 而非 UTC 命名，与本仓库日志时区（Asia/Shanghai）一致
timezone = Asia/Shanghai

# 留空：由 app.database.run_migrations() 注入 engine.url
sqlalchemy.url =

# 版本表名（默认 alembic_version；哨兵逻辑依赖该名字判断"老库无版本表"）
version_table = alembic_version

prepend_sys_path = .

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
