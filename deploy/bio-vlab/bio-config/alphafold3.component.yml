id: alphafold3
name: AlphaFold 3 蛋白质结构预测
enabled: true
category: structure_prediction
provider: DeepMind
tags:
  - gpu
  - structure
  - alphafold

runtime:
  type: docker-container
  image: bio-alphafold3:latest
  command: null

lifecycle:
  start_command: docker run -d --name alphafold3
  stop_command: docker stop alphafold3
  restart_command: docker restart alphafold3
  start_timeout: 600
  stop_timeout: 180

healthcheck:
  mode: http
  endpoint: http://localhost:8092/api/v1/af3/health
  interval: 30
  timeout: 15
  retries: 5
  start_period: 300

resources:
  cpus: "16"
  memory: "64G"
  gpus: 1
  gpu_device_ids: []
  gpu_memory_threshold_mb: 24576
  reservations:
    cpus: "4"
    memory: "16G"
    gpus: 1
  allocation_strategy: exclusive

env:
  AF3_MODEL_DIR: /data/models/alphafold3
  AF3_DBS_DIR: /data/models/alphafold3/dbs
  INFERENCE_DEVICE: cuda
  JOB_TMP_DIR: /tmp/af3_jobs
  PYTHONUNBUFFERED: "1"

volumes:
  - source: ./data/models
    target: /data/models:ro
  - source: alphafold3-tmp
    target: /tmp/af3_jobs

dependencies: []

metadata:
  description: AlphaFold 3 CUDA 版 - 蛋白质结构预测推理服务
  homepage: https://github.com/google-deepmind/alphafold3
  ports:
    - "8092:8092"

# 工具调用集成配置: AlphaFold3Tool 通过 HTTP 调用此端口
# healthcheck endpoint=http://localhost:8092/api/v1/af3/health 推导出主端点
tool_integration:
  port: 8092
  invoke_endpoint: /api/v1/af3/predict
  http_method: POST
  input_schema_ref: ALPHAFOLD3_CUDA_TOOL_INPUT_SCHEMA
  output_schema_ref: ALPHAFOLD3_CUDA_TOOL_OUTPUT_SCHEMA
  warmup_endpoint: null
  request_timeout_seconds: 600
  content_type: application/json
