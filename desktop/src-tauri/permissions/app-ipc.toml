# DeepCode 桌面桥自有命令的 ACL 权限集
#
# 背景（2026-11-01 修复 "Command config_save not allowed by ACL"）：
# 主窗口 label 为 `boot`，启动时加载本地 boot.html，引擎就绪后该窗口会导航到
# `http://127.0.0.1:<port>`——此时 webview 的 origin 由本地 tauri 协议变成 remote。
# Tauri 2 的 ACL 语义是：本地 origin 调用应用自有命令默认放行，而 **remote origin
# 的调用必须显式授予权限**，否则一律拒绝。此前 capabilities 里只有 core:* 系列，
# 从未为自有命令定义 permission，于是"添加模型 → 保存"直接报
# `Command config_save not allowed by ACL`。
#
# 安全边界：这里只放行 src/lib.rs `invoke_handler` 已注册的命令，不引入任何
# 插件能力——shell / fs / http / process 仍然完全不可达（PRD NFR-3 不变）。
# 命令内部的业务授权照旧生效（例如 engine_credentials 仍会自行校验调用来源
# 必须是引擎 origin），ACL 放行不等于绕过这些检查。

[[permission]]
identifier = "allow-app-ipc"
description = "DeepCode 桌面桥自有命令：引擎状态/重启/日志、桌面配置读写、窗口拖动与新建、SSH 远程连接（目标管理/探测/隧道/断开）、desktop-agent 策略配置面（状态/开关/授权）。仅覆盖 invoke_handler 注册面，不暴露 shell/fs/http 插件能力，也不暴露任何 GUI 执行能力。"
commands.allow = [
  "engine_status",
  "engine_restart",
  "engine_open_logs",
  "engine_log_tail",
  "engine_credentials",
  "config_get",
  "config_save",
  # 模型切换器（Composer）：列表 + 设默认并重启。
  # 二者都会自行校验调用来源必须是**本地**引擎 origin（隧道页属远端引擎，
  # 改本地+重启本地引擎既无意义也会误伤本地会话），ACL 放行不绕过该检查。
  "models_list",
  "model_set_default",
  "window_drag",
  "window_new",
  "boot_diag",
  # SSH 远程（M2）：连接成功后窗口会导航到 http://127.0.0.1:<隧道端口>，
  # 该页属 remote origin——不在此授权则前端在远端页上调用 ssh_disconnect /
  # ssh_status 会被 ACL 拒绝（与 config_save 事故同源）。
  "ssh_list_targets",
  "ssh_import_config",
  "ssh_remove_target",
  "ssh_status",
  "ssh_connect",
  "ssh_disconnect",
  # desktop-agent（P1）：仅配置面，能力开关与按应用授权由壳落盘。
  # 窗口枚举 / a11y 树 / 截图 / 输入注入均由独立 sidecar 经 MCP 承担，
  # 不经这些命令，避免把系统特权带进 WebView 的 ACL 视野。
  "desktop_agent_status",
  "desktop_agent_toggle",
  "desktop_agent_permissions_get",
  "desktop_agent_permissions_set",
  # 视觉通道：两步式限时授权（challenge 发一次性令牌 → grant 提交 → revoke 立即撤销）。
  # 这三个命令只写授权，不截图、不注入输入，系统特权仍在 sidecar。
  "desktop_agent_vision_challenge",
  "desktop_agent_vision_grant",
  "desktop_agent_vision_revoke",
]
